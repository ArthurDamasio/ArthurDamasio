name: WakaTime Stats

# Requer o secret WAKATIME_API_KEY configurado no repositório.
# Como ativar:
#   1. Crie conta em wakatime.com
#   2. Instale a extensão WakaTime no VS Code
#   3. Vá em Settings > Secrets > Actions neste repositório
#   4. Adicione o secret WAKATIME_API_KEY com sua API key do WakaTime

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README with WakaTime Stats
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_OS: "True"
          SHOW_PROJECTS: "True"
          SHOW_EDITORS: "True"
          SHOW_LANGUAGE: "True"
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_LINES_OF_CODE: "True"
          SHOW_PROFILE_VIEWS: "True"
          SHOW_SHORT_INFO: "True"
          LOCALE: "pt-BR"
